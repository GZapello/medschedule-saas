<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d9488" />
    <link rel="icon" type="image/webp" href="/brand/zemda-icon-96.webp" />
    
    <!-- SEO head generated from backend/src/seo/seoRoutes.ts by Vite and the server. -->
    <!-- Google Search Console Placeholder (Injetado dinamicamente no backend ou via env) -->
    <!-- %GOOGLE_SITE_VERIFICATION_TAG% -->

    <!-- Google Consent Mode v2 & Google Analytics 4 (GA4) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Padrão de privacidade: todas as categorias não essenciais desativadas (denied)
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied'
      });

      // Restaura consentimento prévio salvo no navegador, se houver
      try {
        var rawConsent = localStorage.getItem('zemda_cookie_consent');
        if (rawConsent) {
          var parsedConsent = JSON.parse(rawConsent);
          if (parsedConsent && parsedConsent.analytics === true) {
            gtag('consent', 'update', {
              'analytics_storage': 'granted'
            });
          }
        }
      } catch (e) {}
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFFJ7Y25ML"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-QFFJ7Y25ML');
      gtag('set', {
        anonymize_ip: true,
        restricted_data_processing: true
      });
    </script>



    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
